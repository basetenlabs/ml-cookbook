name: Whisper Checkpoint Import

on:
  pull_request:
    branches: [main]
    paths:
      - 'training-jobs/examples/whisper-checkpoint-import/**'
      - '.github/workflows/whisper-checkpoint-import.yml'
  push:
    branches: [main]
    paths:
      - 'training-jobs/examples/whisper-checkpoint-import/**'
      - '.github/workflows/whisper-checkpoint-import.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - working-directory: training-jobs/examples/whisper-checkpoint-import
        run: uv run --no-project --python 3.12 --with truss==0.18.16 --with-requirements requirements.txt python -m unittest discover -s . -p 'test_*.py'
      - run: bash -n training-jobs/examples/whisper-checkpoint-import/import_whisper_checkpoint.sh
