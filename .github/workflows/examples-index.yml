name: Examples Index

# Validates .examples-index.json, which `truss train init --examples` reads to
# find examples. No secrets; safe for fork PRs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0
      - run: python3 bin/check_examples_index.py
